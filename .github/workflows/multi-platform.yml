name: Build AutoFPCount

on:
  workflow_dispatch:
  push:
    branches:
      - autofpcount

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build AutoFPCount
        uses: geode-sdk/build-geode-mod@main
        with:
          path: AutoFPCounter-main
          sdk: given
          target: ${{ matrix.config.target }}

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: AutoFPCount-Windows
          path: AutoFPCounter-main/build/**/*.geode
